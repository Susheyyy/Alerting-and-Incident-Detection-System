global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'severity']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-webhook-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default-webhook-receiver'
    webhook_configs:
      - url: 'http://alert-notifier:5001/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://alert-notifier:5001/alerts?level=critical'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://alert-notifier:5001/alerts?level=warning'
        send_resolved: true

inhibit_rules:
  - source_match:
      alertname: 'InstanceDown'
    target_match:
      alertname: 'HighLatency'
    equal: ['job', 'instance']
