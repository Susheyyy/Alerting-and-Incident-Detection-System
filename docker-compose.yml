version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: incident_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - monitoring_net

  traffic-gen:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: incident_traffic_gen
    command: ["python", "traffic_generator.py"]
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - monitoring_net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: incident_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: incident_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring_net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: incident_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring_net

  alert-notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    container_name: incident_alert_notifier
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: incident_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge
