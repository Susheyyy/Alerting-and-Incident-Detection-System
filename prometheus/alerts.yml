groups:
  - name: application-alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Instance is down"
          description: "Target ({{ $labels.job }} - {{ $labels.instance }}) has been unreachable for more than 15 seconds."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="application"}[1m])
            )
          ) > 0.5
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "High application latency"
          description: "95th-percentile request latency exceeds 500ms (current: {{ $value | printf \"%.2f\" }}s)."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="application",status=~"5.."}[1m]))
          /
          sum(rate(http_requests_total{job="application"}[1m])) * 100 > 10
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Application error rate exceeds 10% (current: {{ $value | printf \"%.1f\" }}%)."

  - name: system-alerts
    rules:
      - alert: HighCPU
        expr: |
          100 * (
            1 - avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[1m])
            )
          ) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU utilization"
          description: "Host CPU utilization is above 80% (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighMemory
        expr: |
          100 * (
            1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          ) > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High memory utilization"
          description: "Host memory consumption is above 85% (current: {{ $value | printf \"%.1f\" }}%)."
