global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "application"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:8000"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
